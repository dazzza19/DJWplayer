services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: djw-jellyfin
    network_mode: host
    volumes:
      - /var/lib/djw/appdata/jellyfin:/config
      - /var/cache/djw-jellyfin:/cache
      - /srv/djw/media:/media:ro
      - /srv/djw/downloads/complete:/downloads:ro
    restart: unless-stopped

  jellyseerr:
    image: fallenbagel/jellyseerr:latest
    container_name: djw-jellyseerr
    environment:
      - LOG_LEVEL=info
      - TZ=Etc/UTC
    ports:
      - "5055:5055"
    volumes:
      - /var/lib/djw/appdata/jellyseerr:/app/config
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: djw-radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    ports:
      - "7878:7878"
    volumes:
      - /var/lib/djw/appdata/radarr:/config
      - /srv/djw/media/films:/movies
      - /srv/djw/downloads:/downloads
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: djw-sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    ports:
      - "8989:8989"
    volumes:
      - /var/lib/djw/appdata/sonarr:/config
      - /srv/djw/media/tv:/tv
      - /srv/djw/downloads:/downloads
    restart: unless-stopped

  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: djw-lidarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    ports:
      - "8686:8686"
    volumes:
      - /var/lib/djw/appdata/lidarr:/config
      - /srv/djw/media/music:/music
      - /srv/djw/downloads:/downloads
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: djw-prowlarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    ports:
      - "9696:9696"
    volumes:
      - /var/lib/djw/appdata/prowlarr:/config
    restart: unless-stopped
