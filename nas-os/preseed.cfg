### DJW NAS automated install, Debian 13 amd64
d-i debian-installer/locale string en_GB.UTF-8
d-i debian-installer/country string GB
d-i keyboard-configuration/xkb-keymap select gb
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string djw-main
d-i netcfg/get_domain string lan
d-i netcfg/wireless_wep string
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
d-i passwd/root-login boolean true
d-i passwd/root-password-crypted password $6$AvFXrjJjLk68kp7y$Pte9I0DHBSQ7N.mFYeqhxVgYb0yU8ewk6FXcdw3DxaXGpHZuCKLYOdmn/7B3mJ5IHtydRzm5ey73joNPJvqaS.
d-i passwd/make-user boolean false
d-i clock-setup/utc boolean true
d-i time/zone string Etc/UTC
d-i partman/early_command string \
  disks="$(list-devices disk)"; candidates=""; \
  for d in $disks; do b="$(basename "$d")"; r="/sys/class/block/$b"; \
    [ -e "$r/removable" ] || continue; [ "$(cat "$r/removable")" = 0 ] || continue; \
    path="$(readlink -f "$r/device" 2>/dev/null || true)"; case "$path" in */usb*|*/USB*) continue;; esac; \
    candidates="$candidates $d"; \
  done; set -- $candidates; \
  if [ "$#" -ne 1 ]; then logger -t djw-installer "Expected one internal disk, found $#; stopping before partitioning"; exit 1; fi; \
  debconf-set partman-auto/disk "$1"; debconf-set grub-installer/bootdev "$1"
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true
tasksel tasksel/first multiselect
d-i pkgsel/include string ca-certificates network-manager wpasupplicant firmware-iwlwifi firmware-realtek firmware-atheros firmware-brcm80211 firmware-misc-nonfree python3 openssl systemd-sysv
d-i pkgsel/upgrade select none
d-i pkgsel/update-policy select none
popularity-contest popularity-contest/participate boolean false
d-i cdrom-detect/eject boolean true
d-i finish-install/reboot_in_progress note
d-i preseed/late_command string \
  mkdir -p /target/opt; cp -a /cdrom/djw-nas-installer /target/opt/; \
  chmod +x /target/opt/djw-nas-installer/firstboot.sh /target/opt/djw-nas-installer/install.sh; \
  chmod +x /target/opt/djw-nas-installer/tools/*; \
  cp /target/opt/djw-nas-installer/systemd/djw-firstboot.service /target/etc/systemd/system/; \
  in-target systemctl enable djw-firstboot.service; \
  mkdir -p /target/var/lib/djw
